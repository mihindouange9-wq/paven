# Blueprint Render : site statique construit par Vite, servi par le CDN de Render.
# Mise en route : Render → New → Blueprint → choisir ce dépôt. Chaque push sur la branche suivie redéploie.
services:
  - type: web
    name: paven
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Adresse publique du site : canonical, Open Graph, sitemap, données structurées.
      # À remplacer par le domaine définitif (ex. https://www.locagab.com) dès qu'il est rattaché au service.
      - key: SITE_URL
        value: https://paven.onrender.com
    routes:
      # Page unique : toute adresse inconnue renvoie la page (les fichiers existants sont servis en priorité).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Fichiers empreints par Vite : cache long, jamais revalidés.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /brand/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Le site n'appelle aucun service tiers : scripts, polices et images viennent du domaine lui-même.
      # Les styles en ligne sont nécessaires aux animations (attributs style posés par GSAP).
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests
